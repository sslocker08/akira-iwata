<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集 — 編集</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="%231f6f4a"/></svg>'>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/admin/admin.css">
</head>
<body>
<div id="boot" class="boot">
  <h1>作品集 編集画面</h1>
  <p class="boot__msg" id="bootMsg">読み込み中…</p>
  <p class="boot__hint">この画面は <code>start.command</code>（または <code>node tools/serve-admin.mjs</code>）を起動した状態で開いてください。</p>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar__title">作品集 編集</div>
    <div class="topbar__actions">
      <a class="btn btn--ghost" href="index.html" target="_blank" rel="noopener">プレビュー↗</a>
      <button class="btn" id="btnSave">保存</button>
      <button class="btn btn--primary" id="btnPublish">本番へ公開</button>
    </div>
    <div class="topbar__status" id="status" aria-live="polite"></div>
  </header>

  <div class="tray" id="tray" hidden>
    <div class="tray__label">新しく追加した画像 <small>— ドラッグして好きな場所へ配置</small></div>
    <div class="tray__items" id="trayItems"></div>
  </div>

  <main class="wrap">
    <section class="canvas" id="canvas"></section>

    <aside class="side" id="selPanel" hidden>
      <div class="panel">
        <h2>選択中の画像</h2>
        <div class="sel">
          <img id="selImg" alt="">
          <div class="sel__body">
            <div class="sel__id" id="selId"></div>
            <label class="fld"><span>説明文（alt）</span>
              <textarea id="selAlt" rows="2" placeholder="画像の説明（読み上げ・代替表示用）"></textarea>
            </label>
            <button class="btn btn--sm btn--danger" id="selDelete">完全に削除</button>
          </div>
        </div>
        <button class="btn btn--sm btn--ghost" id="selClose" style="margin-top:.6rem">閉じる</button>
      </div>
    </aside>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" hidden multiple>

<script src="assets/admin/admin.js" defer></script>
</body>
</html>
